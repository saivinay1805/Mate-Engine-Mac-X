<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MateEngine Workshop</title>
  <style>
    :root {
      --bg-window: #16161a;
      --bg-sidebar: #1b1b20;
      --bg-topbar: #1b1b20;
      --bg-card: #222228;
      --border-card: #2f2f38;
      --border-card-hover: #484856;
      --accent-blue: #007aff;
      --accent-hover: #1a8aff;
      --dance-color: #f43f5e;
      --mod-color: #a855f7;
      --success-green: #10b981;
      --warning-amber: #f59e0b;
      --text-primary: #ffffff;
      --text-secondary: #9da3af;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg-window);
      color: var(--text-primary);
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Left Sidebar */
    .sidebar {
      width: 230px;
      min-width: 230px;
      background: var(--bg-sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 56px 14px 20px 14px; /* Leaves space for traffic lights */
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 12px 8px 6px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--accent-blue);
      color: #fff;
      font-weight: 600;
    }

    .nav-item .icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
    }

    .nav-item .badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 7px;
      border-radius: 12px;
      color: var(--text-secondary);
    }

    .nav-item.active .badge {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .id-input-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .id-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s;
    }

    .id-input:focus {
      border-color: var(--accent-blue);
    }

    .id-btn {
      width: 100%;
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .id-btn:hover {
      background: var(--accent-hover);
    }

    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-window);
    }

    /* Top Toolbar */
    .topbar {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: var(--bg-topbar);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 16px;
    }

    /* Search Box */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 5px 12px;
      width: 280px;
      min-width: 200px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent-blue);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 12px;
      width: 100%;
      margin-left: 6px;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    /* Sort Segmented Control (Moved to top as requested!) */
    .sort-control {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 2px;
    }

    .sort-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .sort-btn:hover {
      color: #fff;
    }

    .sort-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
    }

    /* Pagination Actions */
    .pagination-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-info {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
    }

    .pill-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Scrollable Gallery Area */
    .gallery-container {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
    }

    .gallery-container::-webkit-scrollbar {
      width: 8px;
    }

    .gallery-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Standard Native Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      border-color: var(--border-card-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d0d10;
      overflow: hidden;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .thumb-wrapper img {
      transform: scale(1.03);
    }

    .badge-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-avatar {
      background: #0284c7;
      color: #fff;
    }

    .badge-dance {
      background: #e11d48;
      color: #fff;
    }

    .badge-mod {
      background: #7e22ce;
      color: #fff;
    }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-author {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stats {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }

    .install-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-not-installed {
      background: var(--accent-blue);
      color: #fff;
    }

    .btn-not-installed:hover {
      background: var(--accent-hover);
    }

    .btn-downloading {
      background: var(--warning-amber);
      color: #000;
      cursor: default;
    }

    .btn-installed {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      cursor: default;
    }

    /* Download Progress & Cancel UI */
    .download-progress-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .progress-bar-bg {
      flex: 1;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: #0284c7;
      transition: width 0.25s ease;
      border-radius: 6px;
    }

    .progress-text {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .cancel-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .cancel-btn:hover {
      background: rgba(239, 68, 68, 0.45);
      color: #fff;
    }

    /* Load & New Avatar Buttons */
    .btn-load {
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-load:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .btn-new-avatar {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f1f5f9;
      font-weight: 500;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-new-avatar:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .modal-download-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .modal-cancel-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-cancel-btn:hover {
      background: rgba(239, 68, 68, 0.4);
      color: #fff;
    }

    /* Modal / Inspector View */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-window {
      background: #1c1c22;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 14px;
      width: 640px;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .modal-banner {
      width: 100%;
      height: 260px;
      background: #000;
      position: relative;
    }

    .modal-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .modal-content {
      padding: 20px 24px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-author {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .modal-desc {
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.25);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-primary-btn {
      flex: 1;
      background: var(--accent-blue);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .modal-primary-btn:hover {
      background: var(--accent-hover);
    }

    .modal-sec-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .modal-sec-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success-green);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 200;
    }

    /* Loading Spinner */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 14px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Top progress bar for non-blocking background fetching */
    .top-loader {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), #60a5fa, var(--accent-blue));
      background-size: 200% 100%;
      animation: topLoaderAnim 1.2s infinite ease-in-out;
      display: none;
    }

    @keyframes topLoaderAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

      </div>
    </div>

    <div class="section-title">Categories</div>
    <div class="nav-item active" onclick="setCategory('', this)">
      <span class="icon">🌌</span> All Items
    </div>
    <div class="nav-item" onclick="setCategory('Avatar', this)">
      <span class="icon">👤</span> Avatars
    </div>
    <div class="nav-item" onclick="setCategory('Dance', this)">
      <span class="icon">💃</span> Dances
    </div>
    <div class="nav-item" onclick="setCategory('Mod', this)">
      <span class="icon">🛠</span> Mods
    </div>

    <div class="section-title">Local</div>
    <div class="nav-item" onclick="showInstalled(this)">
      <span class="icon">💾</span> Installed Items
      <span class="badge" id="installedCount">0</span>
    </div>

    <div class="sidebar-footer">
      <div class="section-title" style="margin: 0 0 8px 0;">Direct Install by ID</div>
      <div class="id-input-box">
        <input type="text" id="directIdInput" class="id-input" placeholder="e.g. 3672894479">
        <button class="id-btn" onclick="directInstall()">📥 Install Item</button>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="main">
    <!-- Top Toolbar (Search + Sort By + Pagination) -->
    <div class="topbar">
      <!-- Search Input -->
      <div class="search-box">
        <span style="color: var(--text-muted); font-size: 12px;">🔍</span>
        <input type="text" id="searchInput" placeholder="Search models, characters, dances..." onkeydown="handleSearchKey(event)">
      </div>

      <!-- Sort Controls (Moved to Top Toolbar as requested!) -->
      <div class="sort-control">
        <button class="sort-btn active" id="sortTrend" onclick="setSort('trend', this)">🔥 Trending</button>
        <button class="sort-btn" id="sortRecent" onclick="setSort('mostrecent', this)">⏱ Newest</button>
        <button class="sort-btn" id="sortRating" onclick="setSort('starred', this)">⭐ Top Rated</button>
        <button class="sort-btn" id="sortSubs" onclick="setSort('totaluniquesubscribers', this)">👥 Subscribed</button>
      </div>

      <!-- Pagination Controls -->
      <div class="pagination-actions">
        <button class="pill-btn" id="prevBtn" onclick="prevPage()" disabled>‹ Prev</button>
        <span class="page-info" id="pageLabel">Page 1</span>
        <button class="pill-btn" id="nextBtn" onclick="nextPage()">Next ›</button>
        <button class="pill-btn" onclick="refresh()">⟳</button>
      </div>
    </div>

    <!-- Non-blocking top progress bar -->
    <div id="topProgressBar" class="top-loader"></div>

    <!-- Gallery Grid -->
    <div class="gallery-container" id="galleryContainer">
      <div id="loadingView" class="loading-state">
        <div class="spinner"></div>
        <div>Loading workshop items...</div>
      </div>
      <div id="galleryGrid" class="gallery-grid" style="display: none;"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <div class="modal-window" onclick="event.stopPropagation()">
      <div class="modal-banner">
        <img id="modalImg" src="" alt="Preview">
        <button class="modal-close-btn" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-content">
        <div class="modal-title" id="modalTitle">Item Title</div>
        <div class="modal-author" id="modalAuthor">Steam Item ID: Unknown</div>
        <div class="modal-desc" id="modalDesc">No description provided.</div>
        <div class="modal-actions" id="modalActions">
          <button class="modal-primary-btn" onclick="installCurrentModalItem()">📥 Install</button>
          <button class="modal-sec-btn" onclick="openSteamPage()">🔗 View on Steam</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">✓ Installed successfully!</div>

  <script>
    let currentCategory = '';
    let currentSort = 'trend';
    let currentSearch = '';
    let currentPage = 1;
    let totalPages = 1;
    let totalCount = 0;
    let currentItems = [];
    let installedMap = {};
    let downloadingMap = {};
    let selectedItem = null;
    let showingInstalledOnly = false;
    let fetchTimeout = null;

    // In-memory cache for instant 0ms category/sort/page navigation
    const workshopCache = new Map();
    let installedCache = null;

    function getCacheKey(cat, sort, search, page) {
      return `${cat || ''}__${sort || ''}__${search || ''}__${page || 1}`;
    }

    // Send native message to Objective-C
    function postNative(action, payload) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mateWorkshop) {
        window.webkit.messageHandlers.mateWorkshop.postMessage({ action: action, ...(payload || {}) });
      }
    }

    function init() {
      // Query installed items immediately so install badges and counters are accurate
      postNative('get_installed', {});
      fetchItems();
    }

    function fetchItems(force) {
      showingInstalledOnly = false;
      const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);

      // Instant cache hit: render immediately without network request or blanking
      if (!force && workshopCache.has(key)) {
        const cached = workshopCache.get(key);
        window.onWorkshopItemsLoaded(cached);
        return;
      }

      const grid = document.getElementById('galleryGrid');
      const topLoader = document.getElementById('topProgressBar');
      const loadingView = document.getElementById('loadingView');

      // Non-blocking loading: if items are already displayed, keep them visible while topLoader glows
      if (grid && grid.children.length > 0) {
        if (topLoader) topLoader.style.display = 'block';
      } else {
        if (loadingView) loadingView.style.display = 'flex';
        if (grid) grid.style.display = 'none';
      }

      if (fetchTimeout) clearTimeout(fetchTimeout);
      fetchTimeout = setTimeout(() => {
        if (topLoader) topLoader.style.display = 'none';
        if (loadingView) loadingView.style.display = 'none';
        if (grid) {
          grid.style.display = 'grid';
          if (grid.children.length === 0) {
            grid.innerHTML = `
              <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 80px 20px;">
                <p style="font-size: 14px; margin-bottom: 12px;">Steam response timed out or was throttled.</p>
                <button class="pill-btn" onclick="fetchItems(true)" style="padding: 6px 16px; margin: auto;">Retry</button>
              </div>
            `;
          }
        }
      }, 10000);

      postNative('fetch_items', {
        category: currentCategory,
        sort: currentSort,
        search: currentSearch,
        page: currentPage
      });
    }

    function setCategory(cat, element) {
      currentCategory = cat;
      currentPage = 1;
      showingInstalledOnly = false;
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
      if (workshopCache.has(key)) {
        window.onWorkshopItemsLoaded(workshopCache.get(key));
        return;
      }
      fetchItems();
    }

    function setSort(s, element) {
      if (currentSort === s && !showingInstalledOnly) return;
      currentSort = s;
      currentPage = 1;
      showingInstalledOnly = false;
      document.querySelectorAll('.sort-control .sort-btn').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      // Restore active category in sidebar
      document.querySelectorAll('.sidebar .nav-item').forEach(el => {
        el.classList.remove('active');
        if (currentCategory === '' && el.innerText.includes('All Items')) el.classList.add('active');
        else if (currentCategory !== '' && el.innerText.includes(currentCategory)) el.classList.add('active');
      });

      const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
      if (workshopCache.has(key)) {
        window.onWorkshopItemsLoaded(workshopCache.get(key));
        return;
      }
      fetchItems();
    }

    function handleSearchKey(e) {
      if (e.key === 'Enter') {
        const val = document.getElementById('searchInput').value.trim();
        if (val === currentSearch && !showingInstalledOnly) return;
        currentSearch = val;
        currentPage = 1;
        showingInstalledOnly = false;
        document.querySelectorAll('.sidebar .nav-item').forEach(el => {
          el.classList.remove('active');
          if (currentCategory === '' && el.innerText.includes('All Items')) el.classList.add('active');
          else if (currentCategory !== '' && el.innerText.includes(currentCategory)) el.classList.add('active');
        });

        const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
        if (workshopCache.has(key)) {
          window.onWorkshopItemsLoaded(workshopCache.get(key));
          return;
        }
        fetchItems();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        document.getElementById('galleryContainer').scrollTop = 0;
        const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
        if (workshopCache.has(key)) {
          window.onWorkshopItemsLoaded(workshopCache.get(key));
          return;
        }
        fetchItems();
      }
    }

    function nextPage() {
      if (currentPage < totalPages || totalPages === 1) {
        currentPage++;
        document.getElementById('galleryContainer').scrollTop = 0;
        const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
        if (workshopCache.has(key)) {
          window.onWorkshopItemsLoaded(workshopCache.get(key));
          return;
        }
        fetchItems();
      }
    }

    function refresh() {
      const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
      workshopCache.delete(key);
      if (showingInstalledOnly) {
        installedCache = null;
        postNative('get_installed', {});
      } else {
        fetchItems(true);
      }
    }

    function directInstall() {
      const input = document.getElementById('directIdInput').value.trim();
      const match = input.match(/[0-9]{8,12}/);
      if (!match) {
        alert('Please enter a valid Workshop ID or URL');
        return;
      }
      installItem(match[0], 'Item ' + match[0]);
    }

    function installItem(id, title) {
      downloadingMap[id] = { progress: 5, status: 'Connecting to Steam...' };
      renderGrid();
      if (selectedItem && selectedItem.publishedfileid === id) {
        updateModalButton(id);
      }
      postNative('download_item', { id: id, title: title });
    }

    function showInstalled(element) {
      showingInstalledOnly = true;
      document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      if (installedCache !== null) {
        window.onInstalledLoaded(installedCache);
        postNative('get_installed', {}); // silent background refresh
      } else {
        const grid = document.getElementById('galleryGrid');
        const topLoader = document.getElementById('topProgressBar');
        if (grid && grid.children.length > 0) {
          if (topLoader) topLoader.style.display = 'block';
        } else {
          document.getElementById('loadingView').style.display = 'flex';
          if (grid) grid.style.display = 'none';
        }
        postNative('get_installed', {});
      }
    }

    // Safe Base64 delivery from Objective-C to avoid string escaping syntax errors
    window.onWorkshopItemsLoadedBase64 = function(b64) {
      try {
        const binStr = atob(b64);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        const jsonStr = new TextDecoder('utf-8').decode(bytes);
        const data = JSON.parse(jsonStr);
        window.onWorkshopItemsLoaded(data);
      } catch (err) {
        console.error('Error decoding workshop data:', err);
      }
    };

    window.onWorkshopItemsLoaded = function(data) {
      if (fetchTimeout) { clearTimeout(fetchTimeout); fetchTimeout = null; }
      const topLoader = document.getElementById('topProgressBar');
      if (topLoader) topLoader.style.display = 'none';
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('galleryGrid').style.display = 'grid';

      currentItems = data.items || [];
      if (data.installed) {
        Object.assign(installedMap, data.installed);
      }
      currentPage = data.page || currentPage;
      totalPages = data.total_pages || Math.max(1, Math.ceil((data.total_count || 0) / 30));
      totalCount = data.total_count || 0;
      
      const count = Object.keys(installedMap).length;
      document.getElementById('installedCount').innerText = count;

      if (totalPages > 1) {
        document.getElementById('pageLabel').innerText = `Page ${currentPage} of ${totalPages}`;
      } else {
        document.getElementById('pageLabel').innerText = `Page ${currentPage}`;
      }

      document.getElementById('prevBtn').disabled = (currentPage <= 1);
      document.getElementById('nextBtn').disabled = (currentPage >= totalPages && totalPages > 1);

      // Save to in-memory cache
      const key = getCacheKey(currentCategory, currentSort, currentSearch, currentPage);
      workshopCache.set(key, data);

      renderGrid();
    };

    window.onInstalledLoadedBase64 = function(b64) {
      try {
        const binStr = atob(b64);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        const jsonStr = new TextDecoder('utf-8').decode(bytes);
        const items = JSON.parse(jsonStr);
        window.onInstalledLoaded(items);
      } catch (err) {
        console.error('Error decoding installed items:', err);
      }
    };

    window.onInstalledLoaded = function(items) {
      if (fetchTimeout) { clearTimeout(fetchTimeout); fetchTimeout = null; }
      const topLoader = document.getElementById('topProgressBar');
      if (topLoader) topLoader.style.display = 'none';

      installedCache = items || [];
      installedCache.forEach(it => {
        if (it.publishedfileid) installedMap[it.publishedfileid] = true;
      });
      const count = Object.keys(installedMap).length;
      document.getElementById('installedCount').innerText = count;

      if (showingInstalledOnly) {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('galleryGrid').style.display = 'grid';
        currentItems = installedCache;
        document.getElementById('pageLabel').innerText = `Installed (${currentItems.length})`;
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        renderGrid();
      }
    };

    function avatarFallbackSvg(title) {
      const initials = (title || 'VRM').trim().slice(0, 2).toUpperCase();
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%"><rect width="100%" height="100%" fill="%2316171f"/><circle cx="120" cy="65" r="30" fill="%23252736"/><path d="M75,135 C75,100 165,100 165,135 Z" fill="%23252736"/><text x="50%" y="72" font-size="20" font-family="-apple-system, sans-serif" font-weight="bold" fill="%23818cf8" text-anchor="middle">${initials}</text></svg>`;
    }

    window.onDownloadProgress = function(id, progress, status) {
      downloadingMap[id] = { progress: progress, status: status };
      renderGrid();
      if (selectedItem && selectedItem.publishedfileid === id) {
        updateModalButton(id);
      }
    };

    window.onDownloadCancelled = function(id) {
      delete downloadingMap[id];
      renderGrid();
      if (selectedItem && selectedItem.publishedfileid === id) {
        updateModalButton(id);
      }
      showToast('Download cancelled');
    };

    
    window.onAvatarSpawned = function(id, success, msg) {
      if (success) {
        showToast('Created new avatar instance: ' + msg);
      } else {
        showToast('Failed to spawn avatar: ' + msg);
      }
    };

    window.onModelLoaded = function(id, success, msg) {
      if (success) {
        showToast('Model "' + msg + '" loaded into MateEngine!');
      } else {
        showToast('Failed to load: ' + msg);
      }
    };

    window.onDownloadCompleted = function(id, success, message) {
      delete downloadingMap[id];
      if (success) {
        installedMap[id] = true;
        const count = Object.keys(installedMap).length;
        document.getElementById('installedCount').innerText = count;
        showToast('Successfully installed');
      } else {
        showToast('Download failed: ' + message);
      }
      renderGrid();
      if (selectedItem && selectedItem.publishedfileid === id) {
        updateModalButton(id);
      }
    };

    function renderGrid() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      if (currentItems.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 80px 20px;">No workshop items found.</div>';
        return;
      }

      currentItems.forEach(item => {
        const id = item.publishedfileid;
        const isInstalled = !!installedMap[id];
        const isDownloading = !!downloadingMap[id];

        let badgeType = 'avatar';
        let badgeText = 'AVATAR';
        const tags = (item.tags || []).map(t => typeof t === 'string' ? t : (t.tag || ''));
        if (tags.some(t => t.toLowerCase() === 'dance')) {
          badgeType = 'dance';
          badgeText = 'DANCE';
        } else if (tags.some(t => t.toLowerCase() === 'mod')) {
          badgeType = 'mod';
          badgeText = 'MOD';
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        let btnHtml = '';
        const dlInfo = downloadingMap[id];
        if (dlInfo) {
          const pct = Math.round(dlInfo.progress || 5);
          const txt = dlInfo.status || 'Downloading...';
          btnHtml = `
            <div class="download-progress-wrap" onclick="event.stopPropagation()">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pct}%;"></div>
                <div class="progress-text">${txt}</div>
              </div>
              <button class="cancel-btn" onclick="cancelDownload('${id}')" title="Cancel Download">✕</button>
            </div>
          `;
        } else if (isInstalled) {
          btnHtml = `
            <div style="display: flex; align-items: center; gap: 6px;" onclick="event.stopPropagation()">
              <button class="btn-load" onclick="loadModel('${id}', '${escapeQuotes(item.filePath || '')}')" title="Apply to current running avatar">Load</button>
              <button class="btn-new-avatar" onclick="spawnAvatar('${id}', '${escapeQuotes(item.filePath || '')}')" title="Create a new companion avatar on the desktop">+ New Avatar</button>
            </div>
          `;
        } else {
          btnHtml = `<button class="install-btn btn-not-installed" onclick="event.stopPropagation(); installItem('${id}', '${escapeQuotes(item.title)}')">Install</button>`;
        }

        const fallback = avatarFallbackSvg(item.title);
        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${item.preview_url || fallback}" loading="lazy" alt="Preview" onerror="this.src='${fallback}'">
            <div class="badge-tag badge-${badgeType}">${badgeText}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-author">ID: ${id}</div>
            <div class="card-footer">
              <div class="stats">
                <span>Rating: ${item.total_votes || 0}</span>
              </div>
              ${btnHtml}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      selectedItem = item;
      const fallback = avatarFallbackSvg(item.title);
      const imgElem = document.getElementById('modalImg');
      imgElem.src = item.preview_url || fallback;
      imgElem.onerror = function() { this.src = fallback; };
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalAuthor').innerText = `Steam Item ID: ${item.publishedfileid}`;
      document.getElementById('modalDesc').innerText = item.short_description || 'No description provided by author.';
      updateModalButton(item.publishedfileid);
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    function updateModalButton(id) {
      const actions = document.getElementById('modalActions');
      if (!actions) return;
      const dlInfo = downloadingMap[id];
      const isInstalled = !!installedMap[id];

      if (dlInfo) {
        const pct = Math.round(dlInfo.progress || 5);
        const txt = dlInfo.status || 'Downloading...';
        actions.innerHTML = `
          <div class="modal-download-box">
            <div class="progress-bar-bg" style="height: 38px;">
              <div class="progress-bar-fill" style="width: ${pct}%;"></div>
              <div class="progress-text" style="font-size: 12px;">${txt}</div>
            </div>
            <button class="modal-cancel-btn" onclick="cancelCurrentModalDownload()">Cancel</button>
          </div>
        `;
      } else if (isInstalled) {
        actions.innerHTML = `
          <button class="modal-primary-btn btn-load" onclick="loadCurrentModalItem()">Load Model</button>
          <button class="modal-sec-btn" onclick="spawnCurrentModalItem()">+ Spawn as New Avatar</button>
          <button class="modal-sec-btn" onclick="showInFinderCurrentModalItem()">Open in Finder</button>
          <button class="modal-sec-btn" onclick="openSteamPage()">View on Steam</button>
        `;
      } else {
        actions.innerHTML = `
          <button class="modal-primary-btn" onclick="installCurrentModalItem()">Install</button>
          <button class="modal-sec-btn" onclick="openSteamPage()">View on Steam</button>
        `;
      }
    }

    function loadModel(id, path) {
      postNative('load_model', { id: id, path: path });
    }

    function spawnAvatar(id, path) {
      postNative('spawn_avatar', { id: id, path: path });
    }

    function showInFinder(id, path) {
      postNative('show_in_finder', { id: id, path: path });
    }

    function cancelDownload(id) {
      postNative('cancel_download', { id: id });
    }

    function loadCurrentModalItem() {
      if (selectedItem) {
        loadModel(selectedItem.publishedfileid, selectedItem.filePath || '');
      }
    }

    function spawnCurrentModalItem() {
      if (selectedItem) {
        spawnAvatar(selectedItem.publishedfileid, selectedItem.filePath || '');
      }
    }

    function showInFinderCurrentModalItem() {
      if (selectedItem) {
        showInFinder(selectedItem.publishedfileid, selectedItem.filePath || '');
      }
    }

    function cancelCurrentModalDownload() {
      if (selectedItem) {
        cancelDownload(selectedItem.publishedfileid);
      }
    }

    function installCurrentModalItem() {
      if (selectedItem) {
        installItem(selectedItem.publishedfileid, selectedItem.title);
      }
    }

    function openSteamPage() {
      if (selectedItem) {
        postNative('open_steam', { id: selectedItem.publishedfileid });
      }
    }

    function closeModal(e) {
      if (e.target.id === 'modalBackdrop') {
        document.getElementById('modalBackdrop').style.display = 'none';
      }
    }

    function closeModalDirect() {
      document.getElementById('modalBackdrop').style.display = 'none';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    window.onload = init;
  </script>
</body>
</html>
